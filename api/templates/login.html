<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Pharma RAG</title>
<link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
</head>
<body>

<main id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-mark">Pharma RAG</div>
    <h1 id="auth-heading" class="auth-title">Sign in</h1>
    <p id="auth-subtitle" class="auth-sub">Use your email and password.</p>

    <form id="auth-form" class="auth-form">
      <div class="field-group" id="fullname-group" hidden>
        <label for="auth-fullname">Full name</label>
        <input id="auth-fullname" type="text" autocomplete="name" placeholder="Jane Doe" />
      </div>
      <div class="field-group">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </div>
      <div class="field-group">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="6" placeholder="Password" />
      </div>
      <button type="submit" class="btn-apple-primary" id="auth-submit">Sign In</button>
    </form>

    <p id="auth-status" class="auth-status" hidden></p>

    <div class="auth-divider"><span>or</span></div>

    <button id="btn-google" class="btn-apple-secondary">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <p class="auth-toggle">
      <span id="auth-toggle-text">Don't have an account?</span>
      <button type="button" id="auth-toggle-btn" class="link-btn">Create one</button>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="{{ url_for('static', path='js/supabase-client.js') }}"></script>
<script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
